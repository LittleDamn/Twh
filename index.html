<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWH系列漫画 · 幸运抽奖</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e63946'/%3E%3Cpath d='M32 12l5.2 14.6 15.4.5-12.2 9.4 4.3 14.9L32 42.6 19.3 51.4l4.3-14.9L11.4 27l15.4-.5z' fill='%23ffd166'/%3E%3C/svg%3E">
<style>
:root{
  --red:#e63946;
  --deep:#241a14;
  --panel:#2f241d;
  --panel-line:#5a4537;
  --gold:#ffd166;
  --orange:#f77f00;
  --ink:#fff3e0;
  --muted:#c9ae97;
  --ok:#7ce38b;
  --err:#ff7b7b;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -12%, #6b3322 0%, var(--deep) 58%),
    var(--deep);
  background-attachment:fixed;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:22px 14px;
}
.screen{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:540px;}
.hidden{display:none !important;}
.card{
  width:100%;
  background:linear-gradient(180deg, var(--panel) 0%, #241b15 100%);
  border:3px solid var(--panel-line);
  border-radius:22px;
  padding:34px 26px 30px;
  box-shadow:0 20px 46px rgba(0,0,0,.55);
  display:flex;flex-direction:column;align-items:center;gap:16px;
  position:relative;
}
.card::before{
  content:"";position:absolute;inset:8px;border:1px dashed rgba(255,209,102,.28);
  border-radius:16px;pointer-events:none;
}
.logo{
  font-size:46px;font-weight:900;letter-spacing:6px;color:var(--gold);
  text-shadow:3px 3px 0 var(--red),6px 6px 0 rgba(0,0,0,.4);
  text-align:center;line-height:1.1;
}
.logo .th{display:block;font-size:15px;font-weight:700;letter-spacing:10px;color:#e8c98a;margin-top:10px;text-shadow:none;}
.subtitle{color:#f2b880;font-size:15px;letter-spacing:3px;text-align:center;}
.key-box{display:flex;flex-direction:column;gap:12px;margin-top:10px;width:100%;}
#keyInput{
  background:#14100c;border:2px solid var(--panel-line);color:#fff;
  border-radius:13px;padding:14px 16px;font-size:17px;letter-spacing:3px;
  text-align:center;outline:none;width:100%;
}
#keyInput::placeholder{color:#8a7462;letter-spacing:1px;}
#keyInput:focus{border-color:var(--gold);}
.btn{
  background:linear-gradient(180deg, #ffb703 0%, var(--orange) 100%);
  color:#2a1600;border:none;border-radius:14px;
  padding:15px 22px;font-size:19px;font-weight:800;font-family:inherit;
  cursor:pointer;
  box-shadow:0 6px 0 #b3541e, 0 12px 20px rgba(0,0,0,.35);
  transition:transform .08s ease, box-shadow .08s ease, filter .2s;
  width:100%;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b3541e, 0 8px 14px rgba(0,0,0,.3);}
.btn:disabled{filter:grayscale(.75);cursor:not-allowed;opacity:.75;}
.btn:focus-visible,.lg-item:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
#keyMsg{margin-top:2px;font-size:14px;min-height:20px;text-align:center;}
.err{color:var(--err);}
.ok{color:var(--ok);}
h2{font-size:21px;line-height:1.75;color:var(--gold);text-align:center;font-weight:800;}
h2 b{color:#fff;}
#wheelWrap{position:relative;width:min(430px,94vw);aspect-ratio:1;margin:2px auto 0;}
#wheel{width:100%;height:100%;display:block;}
.pointer{
  position:absolute;left:50%;top:-9px;transform:translateX(-50%);
  width:0;height:0;z-index:6;
  border-left:17px solid transparent;border-right:17px solid transparent;border-top:28px solid var(--gold);
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));
}
.pointer::after{content:"";position:absolute;left:-6px;top:-30px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid #a03a10;}
#centerCap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--red);color:#fff;border-radius:50%;width:88px;height:88px;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;
  border:4px solid var(--gold);box-shadow:0 8px 18px rgba(0,0,0,.45);z-index:4;
  letter-spacing:2px;
}
.legend{width:100%;display:flex;flex-direction:column;gap:7px;margin-top:6px;}
.lg-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:#2a201b;border:1px solid var(--panel-line);
  border-radius:10px;padding:9px 14px;font-size:14px;
}
.lg-item .nm{color:var(--ink);}
.lg-item .p{color:var(--gold);font-weight:800;white-space:nowrap;}
#result{min-height:26px;font-size:20px;font-weight:800;color:var(--gold);text-align:center;line-height:1.6;}
#drawNote{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;}
.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
.confetti{position:fixed;width:10px;height:14px;top:-24px;z-index:99;pointer-events:none;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(108vh) rotate(680deg);opacity:.85;}}
@media (prefers-reduced-motion: reduce){
  .btn{transition:none;}
  .confetti{display:none;}
  *{animation:none !important;}
}
/* 结果弹窗（沿用主题配色） */
.modal-mask{position:fixed;inset:0;background:rgba(20,10,5,.72);display:none;align-items:center;justify-content:center;padding:22px 14px;z-index:100;}
.modal-mask.show{display:flex;}
.modal-card{
  width:100%;max-width:400px;max-height:82vh;overflow:auto;
  background:linear-gradient(180deg, var(--panel) 0%, #241b15 100%);
  border:3px solid var(--panel-line);border-radius:22px;
  padding:26px 22px;box-shadow:0 20px 46px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
}
.modal-card h3{font-size:22px;color:var(--gold);font-weight:800;letter-spacing:2px;}
.modal-card .m-txt{font-size:18px;line-height:1.6;color:var(--ink);white-space:pre-wrap;}
.config-info{
  width:100%;text-align:left;background:#1b130d;border:1px dashed var(--panel-line);
  border-radius:10px;padding:12px 14px;font-size:12px;color:var(--muted);
  max-height:240px;overflow:auto;white-space:pre-wrap;line-height:1.6;
}
/* 重置按钮（仅管理员可见） */
.reset-btn{
  width:100%;
  background:#4a1f1f;border:2px solid var(--err);color:#ff9c9c;
  border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;font-family:inherit;
  cursor:pointer;transition:filter .2s,transform .08s;
}
.reset-btn:hover{filter:brightness(1.15);}
.reset-btn:active{transform:translateY(2px);}
</style>
</head>
<body>
<!-- ================= 视图一：密钥校验 ================= -->
<div id="screenKey" class="screen">
  <div class="card">
    <div class="logo">TWH<span class="th">系列漫画 · 读者福利</span></div>
    <div class="subtitle">输入您的专属密钥，开启幸运抽奖</div>
    <div class="key-box">
      <input id="keyInput" placeholder="请输入抽奖密钥" autocomplete="off" spellcheck="false">
      <button class="btn" id="btnKey">验证密钥</button>
      <div id="keyMsg"></div>
    </div>
  </div>
</div>

<!-- ================= 视图二：抽奖转盘 ================= -->
<div id="screenDraw" class="screen hidden">
  <div class="card">
    <h2>感谢您阅读 <b>TWH 系列漫画</b><br>参与幸运抽奖！</h2>
    <div id="wheelWrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="880" height="880"></canvas>
      <div id="centerCap">开始<br>抽奖</div>
    </div>
    <button class="btn" id="btnDraw">去抽奖☞</button>
    <div id="result"></div>
    <div id="drawNote"></div>
    <div class="legend" id="legend"></div>
    <button class="reset-btn hidden" id="resetRecordBtn">重置本机抽奖记录（仅管理员）</button>
  </div>
</div>

<!-- ================= 结果弹窗 ================= -->
<div class="modal-mask" id="modal">
  <div class="modal-card">
    <h3 id="mTitle">抽奖结果</h3>
    <div class="m-txt" id="mText"></div>
    <div id="qrWrap" style="display:none;flex-direction:column;align-items:center;gap:8px;width:100%;">
      <canvas id="qrCanvas" width="260" height="260" style="width:180px;height:180px;background:#fff;border-radius:8px;padding:6px;box-sizing:content-box;"></canvas>
      <div style="font-size:12px;color:var(--muted);line-height:1.5;text-align:center;" id="qrInfo"></div>
    </div>
    <div class="config-info" id="configInfo" style="display:none;"></div>
    <button class="btn" id="modalBtn">确定</button>
  </div>
</div>

/* ================================================================
 * 数据来源：config.txt / password.txt / prize.txt（读不到直接报错，无兜底）
 *   config.txt   —— 全部可配置项（等号分隔，井号注释）
 *   password.txt —— 每行一个有效密钥
 *   prize.txt    —— 第一行奖项个数 N；之后每行：奖品名,显示概率%[,实际权重%]
 *
 * 核心机制：
 * 1. 本机兑换计数：localStorage 记录每个密钥在本机已兑奖次数，验证时显示
 * 2. 加权衰减：普通密钥每兑奖 1 次，该密钥本机加权系数 -= decPerDraw（默认0.1）
 *    → bias = ACTUAL_BIAS - 本机兑奖次数×decPerDraw，最低不低于 minBias（默认1，即按公示概率抽取）
 *    因此普通密钥可多次抽奖，次数越多大奖越难中
 * 3. 管理员密钥（adminKey）：不受衰减、不受次数限制，可无限抽，中奖展示配置
 * 4. 重置按钮：仅管理员可见，一键清空本机所有密钥兑奖记录
 * 5. 特殊奖项「再来一次」：弹窗点继续重抽，不兑奖、不计数、不衰减
 * 6. 转盘扇区 360/n 均分绘制；实际抽取按动态偏置加权
 * ================================================================ */
var $ = function(id){ return document.getElementById(id); };
var wheel = $('wheel'), ctx = wheel.getContext('2d');
var CX = wheel.width/2, CY = wheel.height/2, R = wheel.width/2 - 8;
var TWO_PI = Math.PI*2;
var PALETTE = ['#e63946','#f77f00','#ffd166','#43aa8b','#4d96ff','#9b5de5','#f94144','#f3722c','#f9c74f','#90be6d','#577590','#f72585'];

var cfg = {};            // 从 config.txt 读取
var KEYS = [];           // password.txt
var PRIZES = [];         // prize.txt
var ACTUAL = [];         // 归一化真实概率
var DECLARED = 0;

var rotation = 0;
var sectorCenters = [];
var spinning = false;
var currentKey = '';
var isAdmin = false;
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- 本机兑奖计数（localStorage） ---------------- */
function getAllCounts(){
  try{ return JSON.parse(localStorage.getItem('twh_count') || '{}'); }
  catch(e){ return {}; }
}
function getKeyCount(key){
  return Number(getAllCounts()[key] || 0);
}
function addKeyCount(key){
  var c = getAllCounts();
  c[key] = (Number(c[key] || 0)) + 1;
  localStorage.setItem('twh_count', JSON.stringify(c));
}
function resetAllCounts(){
  localStorage.removeItem('twh_count');
}

/* ---------------- config.txt 解析 ---------------- */
function parseIni(text){
  cfg = {};
  text.split(/\r?\n/).forEach(function(line){
    line = line.trim();
    if(!line || line.charAt(0) === '#') return;
    var eq = line.indexOf('=');
    if(eq <= 0) return;
    var k = line.substring(0,eq).trim();
    var v = line.substring(eq+1).trim();
    if(v === 'true') v = true;
    else if(v === 'false') v = false;
    else if(!isNaN(Number(v))) v = Number(v);
    cfg[k] = v;
  });
}
function applyConfigUI(){
  if(cfg.inputPlaceholder) $('keyInput').placeholder = cfg.inputPlaceholder;
  if(cfg.btnKeyText) $('btnKey').textContent = cfg.btnKeyText;
  if(cfg.btnDrawText) $('btnDraw').textContent = cfg.btnDrawText;
  if(cfg.subtitle) document.querySelector('.subtitle').textContent = cfg.subtitle;
  if(cfg.logoTh) document.querySelector('.logo .th').textContent = cfg.logoTh;
}

/* ---------------- prize.txt 解析 ---------------- */
function parsePrize(lines){
  var arr = [];
  if(lines.length && /^\d+$/.test(lines[0].trim())) DECLARED = parseInt(lines[0].trim(),10);
  for(var i=1;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;
    line = line.replace(/^\d+\s*[\.、)]\s*/, '');
    var parts = line.split(/[,，:：]\s*/);
    if(parts.length < 2) continue;
    var name = parts[0].trim();
    var disp = parseFloat(String(parts[1]).replace(/[%％]/g,''));
    var act = null;
    if(parts.length >= 3){
      var a = parseFloat(String(parts[2]).replace(/[%％]/g,''));
      if(!isNaN(a)) act = a;
    }
    if(!name || isNaN(disp)) continue;
    arr.push({name:name, prob:disp, actual:act});
  }
  return arr;
}

/* ---------------- 动态偏置系数（含本机衰减） ---------------- */
function baseBias(){
  return (typeof cfg.ACTUAL_BIAS === 'number') ? cfg.ACTUAL_BIAS : 1.6;
}
function currentBias(){
  // 管理员固定基础偏置；普通密钥按本机兑奖次数衰减
  if(isAdmin) return baseBias();
  var cnt = getKeyCount(currentKey);
  var b = baseBias() - cnt * (typeof cfg.decPerDraw === 'number' ? cfg.decPerDraw : 0.1);
  return Math.max(b, (typeof cfg.minBias === 'number' ? cfg.minBias : 1));
}
/* 归一化真实概率 */
function buildActual(){
  var bias = currentBias();
  var total = PRIZES.reduce(function(a,p){ return a + p.prob; }, 0) || 100;
  var raw = PRIZES.map(function(p){
    if(p.actual != null && !isNaN(p.actual)) return Math.max(p.actual, 0);
    return Math.pow(p.prob / total, bias);
  });
  var sum = raw.reduce(function(a,b){ return a+b; }, 0) || 1;
  ACTUAL = raw.map(function(v){ return v/sum; });
}

/* ---------------- 数据加载（无兜底，读不到即报错） ---------------- */
function loadData(){
  return fetch('config.txt',{cache:'no-store'})
    .then(function(r0){ if(!r0.ok) throw new Error('缺少 config.txt'); return r0.text(); })
    .then(function(ct){
      parseIni(ct);
      applyConfigUI();
      return fetch('password.txt',{cache:'no-store'})
        .then(function(r1){ if(!r1.ok) throw new Error('缺少 password.txt'); return r1.text(); })
        .then(function(pw){
          return fetch('prize.txt',{cache:'no-store'})
            .then(function(r2){ if(!r2.ok) throw new Error('缺少 prize.txt'); return r2.text(); })
            .then(function(pr){
              KEYS = pw.split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s.length && s.charAt(0)!=='#';});
              PRIZES = parsePrize(pr.split(/\r?\n/));
              if(!KEYS.length || !PRIZES.length) throw new Error('文件内容为空');
            });
        });
    })
    .catch(function(err){
      alert("数据加载失败：" + err.message + "\n请确认同目录存在 config.txt / password.txt / prize.txt");
      throw err;
    })
    .then(function(){
      renderLegend();
      drawWheel();
    });
}

/* ---------------- 图例（公示概率） ---------------- */
function renderLegend(){
  var el = $('legend');
  el.innerHTML = '';
  PRIZES.forEach(function(p){
    var row = document.createElement('div');
    row.className = 'lg-item';
    var nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = p.name;
    var pc = document.createElement('span');
    pc.className = 'p'; pc.textContent = p.prob + '%';
    row.appendChild(nm); row.appendChild(pc);
    el.appendChild(row);
  });
}

/* ---------------- 转盘绘制（360/n 均分） ---------------- */
function drawWheel(){
  ctx.clearRect(0,0,wheel.width,wheel.height);
  ctx.save();
  ctx.translate(CX,CY);
  ctx.rotate(rotation);
  ctx.translate(-CX,-CY);
  var n = PRIZES.length;
  var sweep = TWO_PI / n;   // 360/n
  var start = 0;
  sectorCenters = [];
  PRIZES.forEach(function(p,i){
    ctx.beginPath();
    ctx.moveTo(CX,CY);
    ctx.arc(CX,CY,R,start,start+sweep);
    ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,18,8,.45)';
    ctx.lineWidth = 3;
    ctx.stroke();
    var mid = start + sweep/2;
    sectorCenters.push(mid);
    ctx.save();
    ctx.translate(CX,CY);
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 6;
    var fs = n > 8 ? 24 : 32;
    ctx.font = 'bold ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    var short = p.name.length > 8 ? p.name.slice(0,8)+'…' : p.name;
    ctx.fillText(short, R-20, 11);
    ctx.restore();
    start += sweep;
  });
  ctx.restore();
  ctx.beginPath(); ctx.arc(CX,CY,R+4,0,TWO_PI);
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 12; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX,CY,R+12,0,TWO_PI);
  ctx.strokeStyle = '#5b3a1e'; ctx.lineWidth = 4; ctx.stroke();
}

/* ---------------- 真实抽取（动态偏置） ---------------- */
function pickIndex(){
  buildActual();
  var r = Math.random(), acc = 0;
  for(var i=0;i<ACTUAL.length;i++){
    acc += ACTUAL[i];
    if(r <= acc) return i;
  }
  return ACTUAL.length-1;
}

/* ---------------- 转盘动画 ---------------- */
function spinTo(idx, done){
  var c = sectorCenters[idx];
  var targetMod = ((-Math.PI/2 - c) % TWO_PI + TWO_PI) % TWO_PI;
  var base = ((rotation % TWO_PI) + TWO_PI) % TWO_PI;
  var delta = ((targetMod - base) % TWO_PI + TWO_PI) % TWO_PI;
  var loop = (typeof cfg.rotateLoop === 'number' && cfg.rotateLoop > 0) ? cfg.rotateLoop : 6;
  var finalRot = rotation + delta + TWO_PI*loop;
  if(reduced){ rotation = finalRot; drawWheel(); done(); return; }
  var from = rotation, t0 = performance.now();
  var dur = (typeof cfg.rotateTime === 'number' && cfg.rotateTime > 0) ? cfg.rotateTime : 4200;
  function frame(now){
    var t = Math.min(1,(now-t0)/dur);
    var e = 1 - Math.pow(1-t,3);
    rotation = from + (finalRot-from)*e;
    drawWheel();
    if(t < 1) requestAnimationFrame(frame); else done();
  }
  requestAnimationFrame(frame);
}

function confetti(){
  if(reduced) return;
  var colors = ['#e63946','#ffd166','#f77f00','#43aa8b','#4d96ff','#f9c74f'];
  for(var i=0;i<34;i++){
    var d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = (Math.random()*100).toFixed(2) + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (1.6 + Math.random()*1.5).toFixed(2) + 's';
    d.style.animationDelay = (Math.random()*0.35).toFixed(2) + 's';
    d.style.transform = 'rotate(' + Math.floor(Math.random()*360) + 'deg)';
    document.body.appendChild(d);
    (function(node){ setTimeout(function(){ node.remove(); }, 3600); })(d);
  }
}

/* ---------------- 结果弹窗（white-space:pre-wrap 保证 \n 换行生效） ---------------- */
function showModal(title, text, showConfig, configText){
  $('mTitle').textContent = title;
  $('mText').textContent = text;
  var ci = $('configInfo');
  if(showConfig){
    ci.style.display = 'block';
    ci.textContent = configText;
  }else{
    ci.style.display = 'none';
  }
  $('modal').classList.add('show');
}

/* ---------------- 设备型号检测（根据 UA） ---------------- */
function getDeviceInfo(){
  var ua = navigator.userAgent || '';
  var os = '';
  if(/Windows/.test(ua)) os = 'Windows';
  else if(/Mac OS X|Macintosh/.test(ua)) os = 'macOS';
  else if(/Android/.test(ua)) os = 'Android';
  else if(/iPhone|iPad|iPod/.test(ua)) os = 'iOS';
  else if(/Linux/.test(ua)) os = 'Linux';
  var brand = '';
  if(/MiuiBuild|XiaoMi|Redmi/.test(ua)) brand = '小米/Redmi';
  else if(/Huawei|Honor/.test(ua)) brand = '华为/荣耀';
  else if(/OPPO/.test(ua)) brand = 'OPPO';
  else if(/vivo|VIVO/.test(ua)) brand = 'vivo';
  else if(/Samsung|SM-/.test(ua)) brand = '三星';
  else if(/iPhone/.test(ua)) brand = 'Apple iPhone';
  else if(/iPad/.test(ua)) brand = 'Apple iPad';
  else if(/Mac/.test(ua)) brand = 'Apple Mac';
  else if(/Windows/.test(ua)) brand = 'PC';
  // 尝试提取型号：Android/iPhone 中的设备名
  var model = '';
  var m;
  if(/iPhone/.test(ua)){ m = ua.match(/iPhone OS \d+_\d+/); model = m ? m[0].replace('iPhone OS ','iOS ') : 'iPhone'; }
  else if(/Android/.test(ua)){ m = ua.match(/Android \d+(\.\d+)*/); model = m ? m[0] : 'Android'; }
  var detail = model ? (brand + ' / ' + model + ' / ' + os) : (brand + ' / ' + os);
  return detail;
}

/* ---------------- 设备码编码（6位：厂商1+浏览器1+型号2+序号2） ----------------
 * 依据 ASC.txt 对照表编码，UNPWD.html 依表解码
 * 例：AC01X7 = Apple / Chrome / iPhone系列 / 序号X7 */
function getDeviceCode(){
  var ua = navigator.userAgent || '';
  // 厂商码（1位，对应 ASC.txt 厂商段）
  var vendor = 'U';
  if(/Windows/.test(ua)) vendor = 'W';
  else if(/Macintosh|Mac OS/.test(ua)) vendor = 'M';
  else if(/MiuiBuild|XiaoMi|Redmi/.test(ua)) vendor = 'X';
  else if(/Huawei|Honor/.test(ua)) vendor = 'H';
  else if(/OPPO/.test(ua)) vendor = 'O';
  else if(/vivo|VIVO/.test(ua)) vendor = 'V';
  else if(/Samsung|SM-/.test(ua)) vendor = 'S';
  else if(/iPhone|iPad|iPod/.test(ua)) vendor = 'A';
  else if(/Linux/.test(ua)) vendor = 'L';
  // 浏览器码（1位，对应 ASC.txt 浏览器段）
  var brow = 'U';
  if(/Edg\/|Edge\//.test(ua)) brow = 'E';
  else if(/OPR|Opera/.test(ua)) brow = 'O';
  else if(/Firefox/.test(ua)) brow = 'F';
  else if(/CriOS|Chrome/.test(ua)) brow = 'C';
  else if(/Safari/.test(ua)) brow = 'S';
  // 型号码（2位，对应 ASC.txt 型号段）
  var model = '00';
  if(/iPhone/.test(ua)) model = '01';
  else if(/iPad/.test(ua)) model = '02';
  else if(/Redmi/.test(ua)) model = '03';
  else if(/XiaoMi|MiuiBuild/.test(ua)) model = '04';
  else if(/Huawei|Honor/.test(ua)) model = '05';
  else if(/OPPO/.test(ua)) model = '07';
  else if(/vivo|VIVO/.test(ua)) model = '08';
  else if(/Samsung|SM-/.test(ua)) model = '09';
  else if(/MacBook/.test(ua)) model = '10';
  else if(/Macintosh|Mac OS/.test(ua)) model = '11';
  else if(/Windows|Linux/.test(ua)) model = '12';
  else if(/Android/.test(ua)) model = '13';
  // 序号（2位）：保证同奖项同日多次唯一
  var seqChars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var seq = seqChars.charAt(Math.floor(Math.random()*36)) + seqChars.charAt(Math.floor(Math.random()*36));
  return vendor + brow + model + seq;
}

/* ---------------- 奖项唯一前缀码 ----------------
 * 规则：从奖项名称开头逐位取字符，首字母相同则取下一位，直到所有奖项前缀各不相同
 * 例：TWH全册漫画/TWH卡包*1/TWH卡包*2 → TWH全 / TWH卡包*1 / TWH卡包*2
 * 该规则须与 UNPWD.html 保持一致 */
function getPrizeCode(name){
  var names = PRIZES.map(function(p){ return p.name; });
  var len = 1;
  while(len <= name.length){
    var pre = name.slice(0, len);
    var cnt = 0;
    for(var i=0;i<names.length;i++){ if(names[i].slice(0, len) === pre) cnt++; }
    if(cnt === 1) return pre;
    len++;
  }
  return name;
}

/* ---------------- 校验码（验证码） ----------------
 * 根据 奖项前缀码+日期+设备码 计算 2 位校验码，用于 UNPWD 验证密钥有效 */
var KEYCHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function calcCheck(x, yymmdd, cc){
  var s = x + yymmdd + cc;
  var sum = 0;
  for(var i=0;i<s.length;i++) sum += s.charCodeAt(i);
  var a = sum % 36;
  var b = Math.floor(sum / 36) % 36;
  return KEYCHARS.charAt(a) + KEYCHARS.charAt(b);
}

/* ---------------- 后台生成兑换密钥 ----------------
 * 格式：X(奖项唯一前缀码) + YYMMDD + CCCCCC(6位设备码) + VV(2位校验码)
 * 例：TWH全册漫画 → TWH全251025AC01X7Q2
 * CCCCCC 为设备码，编码规则见 getDeviceCode（厂商1+浏览器1+型号2+序号2），UNPWD 依 ASC.txt 解码
 * VV 为校验码，由 calcCheck 生成，供 UNPWD.html 验证密钥有效 */
function makePrizeKey(prizeName){
  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  var now = new Date();
  var x = getPrizeCode(prizeName || '');
  var yymmdd = pad(now.getFullYear() % 100) + pad(now.getMonth()+1) + pad(now.getDate());
  var cc = getDeviceCode();
  var vv = calcCheck(x, yymmdd, cc);
  return x + yymmdd + cc + vv;
}

/* ---------------- 生成中奖二维码（内容含兑换密钥/时间/奖品/设备等） ---------------- */
function makePrizeQR(prizeKey, prizeName){
  var now = new Date();
  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  var timeStr = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate())
    + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  var dev = getDeviceInfo();
  var content =
    'TWH幸运抽奖中奖凭证\n' +
    '兑换密钥：' + prizeKey + '\n' +
    '奖品：' + prizeName + '\n' +
    '中奖时间：' + timeStr + '\n' +
    '设备型号：' + dev + '\n' +
    '本机兑奖次数：' + getKeyCount(currentKey) + '\n' +
    '来源：TWH系列漫画读者福利';
  var cv = $('qrCanvas');
  var ctx2 = cv.getContext('2d');
  var wrap = $('qrWrap');
  if(typeof qrcode !== 'function'){ wrap.style.display = 'none'; $('qrInfo').textContent = ''; return; }
  var qr;
  try{
    qr = qrcode(0, 'M');
    qr.addData(content, 'Byte');
    qr.make();
  }catch(e){
    wrap.style.display = 'none'; $('qrInfo').textContent = '二维码生成失败'; return;
  }
  var N = qr.getModuleCount();
  var size = 260, pad2 = 12;
  var cell = Math.floor((size - pad2*2) / N);
  cv.width = size; cv.height = size;
  ctx2.fillStyle = '#ffffff';
  ctx2.fillRect(0, 0, size, size);
  ctx2.fillStyle = '#000000';
  var off = Math.floor((size - cell*N) / 2);
  for(var r=0; r<N; r++){
    for(var c=0; c<N; c++){
      if(qr.isDark(r, c)) ctx2.fillRect(off + c*cell, off + r*cell, cell, cell);
    }
  }
  wrap.style.display = 'flex';
  $('qrInfo').textContent = '扫码查看中奖信息 · 时间·奖品·设备';
}

function hideModal(){
  $('modal').classList.remove('show');
  $('qrWrap').style.display = 'none';
}

/* ---------------- 交互：密钥校验 ---------------- */
$('btnKey').addEventListener('click', verifyKey);
$('keyInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') verifyKey(); });

function verifyKey(){
  var v = $('keyInput').value.trim();
  var msg = $('keyMsg');
  if(!v){ msg.className = 'err'; msg.textContent = cfg.msgKeyEmpty || '请输入密钥'; return; }
  if(KEYS.indexOf(v) !== -1){
    isAdmin = (cfg.adminKey && v === cfg.adminKey);
    // 重置按钮仅管理员可见
    $('resetRecordBtn').classList.toggle('hidden', !isAdmin);
    var cnt = getKeyCount(v);
    msg.className = 'ok';
    msg.textContent = (cfg.msgKeyOk || '密钥有效，欢迎参加抽奖！') + '　本机已兑奖 ' + cnt + ' 次'
      + (isAdmin ? '' : '　当前系数 ' + currentBias().toFixed(2));
    setTimeout(function(){
      $('screenKey').classList.add('hidden');
      $('screenDraw').classList.remove('hidden');
      enterDraw(v);
    }, 420);
  }else{
    msg.className = 'err';
    msg.textContent = cfg.msgKeyInvalid || '密钥无效，请检查后重试';
    var box = $('keyInput');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  }
}

function enterDraw(key){
  currentKey = key;
  var btn = $('btnDraw');
  var note = $('drawNote');
  btn.disabled = false;
  btn.textContent = cfg.btnDrawText || '去抽奖☞';
  var cnt = getKeyCount(key);
  var bias = currentBias();
  note.textContent = (isAdmin
    ? (cfg.noteAdmin || '无限测试密钥：可无限次抽奖；每抽一次展示配置')
    : (cfg.noteNormal || '普通密钥：可多次抽奖，每兑奖一次本机加权系数 -0.1（最低衰减到1，即按公示概率抽取）；再来一次不计次'))
    + '　本机已兑奖 ' + cnt + ' 次 / 当前系数 ' + bias.toFixed(2);
  $('result').textContent = '';
}

/* ---------------- 交互：重置记录（仅管理员） ---------------- */
$('resetRecordBtn').addEventListener('click', function(){
  if(!isAdmin) return;
  if(confirm('确定清空本机全部密钥的兑奖记录吗？（仅本机浏览器生效）')){
    resetAllCounts();
    enterDraw(currentKey);
    $('result').textContent = '本机抽奖记录已重置';
  }
});

/* ---------------- 交互：抽奖 ---------------- */
$('btnDraw').addEventListener('click', runDraw);

function runDraw(){
  if(spinning) return;
  spinning = true;
  var btn = $('btnDraw');
  var res = $('result');
  btn.disabled = true;
  res.textContent = cfg.textSpinning || '转盘转动中…';
  var idx = pickIndex();
  spinTo(idx, function(){
    spinning = false;
    btn.disabled = false;
    var prize = PRIZES[idx];
    if(prize.name === '再来一次'){
      res.textContent = cfg.textAgain || '🎉 抽到【再来一次】';
      btn.textContent = cfg.btnAgainText || '继续';
      showModal(cfg.titleAgain || '再来一次', cfg.textAgainModal || '🎉 抽到【再来一次】\n点击继续，重新抽奖', false);
      $('modalBtn').onclick = function(){ hideModal(); runDraw(); };
    }else if(prize.name === '谢谢支持'){
      // 谢谢支持：不生成兑换密钥、不生成二维码
      res.textContent = prize.name;
      btn.textContent = cfg.btnDrawText || '去抽奖☞';
      if(isAdmin){
        showModal(cfg.titleThanks || '谢谢支持', (cfg.textThanks || '感谢您的参与，谢谢支持！') + '\n（管理员：本机已兑奖 ' + getKeyCount(currentKey) + ' 次）', false);
      }else{
        addKeyCount(currentKey);
        var ncnt2 = getKeyCount(currentKey);
        var nbias2 = currentBias();
        showModal(cfg.titleThanks || '谢谢支持', (cfg.textThanks || '感谢您的参与，谢谢支持！') + '\n本机已兑奖 ' + ncnt2 + ' 次\n当前加权系数：' + nbias2.toFixed(2), false);
      }
      $('modalBtn').onclick = function(){
        hideModal();
        if(!isAdmin) enterDraw(currentKey);
      };
    }else{
      res.textContent = (cfg.textWin || '恭喜您抽中：') + prize.name;
      confetti();
      // 后台生成兑换密钥，密钥转二维码（不含谢谢支持）
      var prizeKey = makePrizeKey(prize.name);
      if(isAdmin){
        // 管理员：不计数、不衰减，可继续，展示配置
        btn.textContent = cfg.btnDrawText || '去抽奖☞';
        var cfgText = generateConfigText();
        makePrizeQR(prizeKey, prize.name);
        showModal(cfg.titleWin || '恭喜中奖',
          (cfg.textWin || '恭喜您抽中：') + prize.name + '\n兑换密钥：' + prizeKey + '\n（管理员：本机已兑奖 ' + getKeyCount(currentKey) + ' 次）',
          true, cfgText);
        $('modalBtn').onclick = function(){ hideModal(); };
      }else{
        // 普通密钥：兑奖 +1，系数衰减，可继续抽
        addKeyCount(currentKey);
        var ncnt = getKeyCount(currentKey);
        var nbias = currentBias();
        btn.textContent = cfg.btnDrawText || '去抽奖☞';
        makePrizeQR(prizeKey, prize.name);
        showModal(cfg.titleWin || '恭喜中奖',
          (cfg.textWin || '恭喜您抽中：') + prize.name + '\n兑换密钥：' + prizeKey + '\n本机已兑奖 ' + ncnt + ' 次\n当前加权系数：' + nbias.toFixed(2),
          false);
        $('modalBtn').onclick = function(){
          hideModal();
          enterDraw(currentKey);
        };
      }
    }
  });
}

function generateConfigText(){
  var s = '# prize.txt 奖品配置\n# 格式：奖品名,显示概率%[,实际权重%]\n# 再来一次 为特殊奖项\n\n当前奖品列表：\n';
  PRIZES.forEach(function(p){
    s += (p.name + ',' + p.prob + '%\n');
  });
  s += '\n# config.txt 全部配置参数：\n';
  Object.keys(cfg).forEach(function(k){ s += k + '=' + cfg[k] + '\n'; });
  s += '\n# password.txt：普通密钥，每行一个';
  return s;
}

loadData();
</script>
