<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWH系列漫画 · 幸运抽奖</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e63946'/%3E%3Cpath d='M32 12l5.2 14.6 15.4.5-12.2 9.4 4.3 14.9L32 42.6 19.3 51.4l4.3-14.9L11.4 27l15.4-.5z' fill='%23ffd166'/%3E%3C/svg%3E">
<style>
:root{
  --red:#e63946;
  --deep:#241a14;
  --panel:#2f241d;
  --panel-line:#5a4537;
  --gold:#ffd166;
  --orange:#f77f00;
  --ink:#fff3e0;
  --muted:#c9ae97;
  --ok:#7ce38b;
  --err:#ff7b7b;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -12%, #6b3322 0%, var(--deep) 58%),
    var(--deep);
  background-attachment:fixed;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:22px 14px;
}
.screen{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:540px;}
.hidden{display:none !important;}
.card{
  width:100%;
  background:linear-gradient(180deg, var(--panel) 0%, #241b15 100%);
  border:3px solid var(--panel-line);
  border-radius:22px;
  padding:34px 26px 30px;
  box-shadow:0 20px 46px rgba(0,0,0,.55);
  display:flex;flex-direction:column;align-items:center;gap:16px;
  position:relative;
}
.card::before{
  content:"";position:absolute;inset:8px;border:1px dashed rgba(255,209,102,.28);
  border-radius:16px;pointer-events:none;
}
.logo{
  font-size:46px;font-weight:900;letter-spacing:6px;color:var(--gold);
  text-shadow:3px 3px 0 var(--red),6px 6px 0 rgba(0,0,0,.4);
  text-align:center;line-height:1.1;
}
.logo .th{display:block;font-size:15px;font-weight:700;letter-spacing:10px;color:#e8c98a;margin-top:10px;text-shadow:none;}
.subtitle{color:#f2b880;font-size:15px;letter-spacing:3px;text-align:center;}
.key-box{display:flex;flex-direction:column;gap:12px;margin-top:10px;width:100%;}
#keyInput{
  background:#14100c;border:2px solid var(--panel-line);color:#fff;
  border-radius:13px;padding:14px 16px;font-size:17px;letter-spacing:3px;
  text-align:center;outline:none;width:100%;
}
#keyInput::placeholder{color:#8a7462;letter-spacing:1px;}
#keyInput:focus{border-color:var(--gold);}
.btn{
  background:linear-gradient(180deg, #ffb703 0%, var(--orange) 100%);
  color:#2a1600;border:none;border-radius:14px;
  padding:15px 22px;font-size:19px;font-weight:800;font-family:inherit;
  cursor:pointer;
  box-shadow:0 6px 0 #b3541e, 0 12px 20px rgba(0,0,0,.35);
  transition:transform .08s ease, box-shadow .08s ease, filter .2s;
  width:100%;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b3541e, 0 8px 14px rgba(0,0,0,.3);}
.btn:disabled{filter:grayscale(.75);cursor:not-allowed;opacity:.75;}
.btn:focus-visible,.lg-item:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
#keyMsg{margin-top:2px;font-size:14px;min-height:20px;text-align:center;}
.err{color:var(--err);}
.ok{color:var(--ok);}
h2{font-size:21px;line-height:1.75;color:var(--gold);text-align:center;font-weight:800;}
h2 b{color:#fff;}
#wheelWrap{position:relative;width:min(430px,94vw);aspect-ratio:1;margin:2px auto 0;}
#wheel{width:100%;height:100%;display:block;}
.pointer{
  position:absolute;left:50%;top:-9px;transform:translateX(-50%);
  width:0;height:0;z-index:6;
  border-left:17px solid transparent;border-right:17px solid transparent;border-top:28px solid var(--gold);
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));
}
.pointer::after{content:"";position:absolute;left:-6px;top:-30px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid #a03a10;}
#centerCap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--red);color:#fff;border-radius:50%;width:88px;height:88px;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;
  border:4px solid var(--gold);box-shadow:0 8px 18px rgba(0,0,0,.45);z-index:4;
  letter-spacing:2px;
}
.legend{width:100%;display:flex;flex-direction:column;gap:7px;margin-top:6px;}
.lg-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:#2a201b;border:1px solid var(--panel-line);
  border-radius:10px;padding:9px 14px;font-size:14px;
}
.lg-item .nm{color:var(--ink);}
.lg-item .p{color:var(--gold);font-weight:800;white-space:nowrap;}
#result{min-height:26px;font-size:20px;font-weight:800;color:var(--gold);text-align:center;line-height:1.6;}
#drawNote{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;}
.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
.confetti{position:fixed;width:10px;height:14px;top:-24px;z-index:99;pointer-events:none;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(108vh) rotate(680deg);opacity:.85;}}
@media (prefers-reduced-motion: reduce){
  .btn{transition:none;}
  .confetti{display:none;}
  *{animation:none !important;}
}
</style>
</head>
<body>
<div id="screenKey" class="screen">
  <div class="card">
    <div class="logo">TWH<span class="th">系列漫画 · 读者福利</span></div>
    <div class="subtitle">输入您的专属密钥，开启幸运抽奖</div>
    <div class="key-box">
      <input id="keyInput" placeholder="请输入抽奖密钥" autocomplete="off" spellcheck="false">
      <button class="btn" id="btnKey">验证密钥</button>
      <div id="keyMsg"></div>
    </div>
  </div>
</div>

<div id="screenDraw" class="screen hidden">
  <div class="card">
    <h2>感谢您阅读 <b>TWH 系列漫画</b><br>参与幸运抽奖！</h2>
    <div id="wheelWrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="880" height="880"></canvas>
      <div id="centerCap">开始<br>抽奖</div>
    </div>
    <button class="btn" id="btnDraw">去抽奖☞</button>
    <div id="result"></div>
    <div id="drawNote"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
var ACTUAL_BIAS = 1.6;

var KEYS = [];
var PRIZES = [];
var ACTUAL = [];
var DECLARED = 0;

var $ = function(id){ return document.getElementById(id); };
var wheel = $('wheel'), ctx = wheel.getContext('2d');
var CX = wheel.width/2, CY = wheel.height/2, R = wheel.width/2 - 8;
var TWO_PI = Math.PI*2;
var PALETTE = ['#e63946','#f77f00','#ffd166','#43aa8b','#4d96ff','#9b5de5','#f94144','#f3722c','#f9c74f','#90be6d','#577590','#f72585'];

var rotation = 0;
var sectorCenters = [];
var spinning = false;
var currentKey = '';
var hasDrawn = false; //标记该密钥是否已经完成有效抽奖（排除再来一次）
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function parsePrize(lines){
  var arr = [];
  if(lines.length && /^\d+$/.test(lines[0].trim())) DECLARED = parseInt(lines[0].trim(),10);
  for(var i=1;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;
    line = line.replace(/^\d+\s*[\.、)]\s*/, '');
    var parts = line.split(/[,，:：]\s*/);
    if(parts.length < 2) continue;
    var name = parts[0].trim();
    var disp = parseFloat(String(parts[1]).replace(/[%％]/g,''));
    var act = null;
    if(parts.length >= 3){
      var a = parseFloat(String(parts[2]).replace(/[%％]/g,''));
      if(!isNaN(a)) act = a;
    }
    if(!name || isNaN(disp)) continue;
    arr.push({name:name, prob:disp, actual:act});
  }
  return arr;
}

function buildActual(){
  ACTUAL = PRIZES.map(function(p){
    var w = (p.actual != null && !isNaN(p.actual)) ? p.actual : Math.pow(p.prob/100, ACTUAL_BIAS);
    return Math.max(w, 0);
  });
  var sum = ACTUAL.reduce(function(a,b){return a+b;},0) || 1;
  ACTUAL = ACTUAL.map(function(v){return v/sum;});
}

function loadData(){
  return fetch('password.txt',{cache:'no-store'})
    .then(function(r1){
      if(!r1.ok) throw new Error('缺少 password.txt');
      return r1.text();
    })
    .then(function(pw){
      return fetch('prize.txt',{cache:'no-store'})
      .then(function(r2){
        if(!r2.ok) throw new Error('缺少 prize.txt');
        return r2.text();
      })
      .then(function(pr){
        KEYS = pw.split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s.length;});
        PRIZES = parsePrize(pr.split(/\r?\n/));
        if(!KEYS.length || !PRIZES.length) throw new Error('文件内容为空');
      });
    })
    .catch(function(err){
      alert("数据加载失败：" + err.message + "\n请确认同目录存在 password.txt 和 prize.txt");
      throw err;
    })
    .then(function(){
      buildActual();
      renderLegend();
      drawWheel();
    });
}

function renderLegend(){
  var el = $('legend');
  el.innerHTML = '';
  PRIZES.forEach(function(p){
    var row = document.createElement('div');
    row.className = 'lg-item';
    var nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = p.name;
    var pc = document.createElement('span');
    pc.className = 'p'; pc.textContent = p.prob + '%';
    row.appendChild(nm); row.appendChild(pc);
    el.appendChild(row);
  });
}

function drawWheel(){
  ctx.clearRect(0,0,wheel.width,wheel.height);
  ctx.save();
  ctx.translate(CX,CY);
  ctx.rotate(rotation);
  ctx.translate(-CX,-CY);

  var n = PRIZES.length;
  var sweep = TWO_PI / n;
  var start = 0;
  sectorCenters = [];

  PRIZES.forEach(function(p,i){
    ctx.beginPath();
    ctx.moveTo(CX,CY);
    ctx.arc(CX,CY,R,start,start+sweep);
    ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,18,8,.45)';
    ctx.lineWidth = 3;
    ctx.stroke();

    var mid = start + sweep/2;
    sectorCenters.push(mid);

    ctx.save();
    ctx.translate(CX,CY);
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 6;
    var fs = n > 8 ? 24 : 32;
    ctx.font = 'bold ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    var short = p.name.length > 8 ? p.name.slice(0,8)+'…' : p.name;
    ctx.fillText(short, R-20, 11);
    ctx.restore();

    start += sweep;
  });

  ctx.restore();
  ctx.beginPath(); ctx.arc(CX,CY,R+4,0,TWO_PI);
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 12; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX,CY,R+12,0,TWO_PI);
  ctx.strokeStyle = '#5b3a1e'; ctx.lineWidth = 4; ctx.stroke();
}

function pickIndex(){
  var r = Math.random(), acc = 0;
  for(var i=0;i<ACTUAL.length;i++){
    acc += ACTUAL[i];
    if(r <= acc) return i;
  }
  return ACTUAL.length-1;
}

function spinTo(idx, done){
  var c = sectorCenters[idx];
  var targetMod = ((-Math.PI/2 - c) % TWO_PI + TWO_PI) % TWO_PI;
  var base = ((rotation % TWO_PI) + TWO_PI) % TWO_PI;
  var delta = ((targetMod - base) % TWO_PI + TWO_PI) % TWO_PI;
  var finalRot = rotation + delta + TWO_PI*(6 + Math.floor(Math.random()*3));
  if(reduced){ rotation = finalRot; drawWheel(); done(); return; }
  var from = rotation, t0 = performance.now(), dur = 4200;
  function frame(now){
    var t = Math.min(1,(now-t0)/dur);
    var e = 1 - Math.pow(1-t,3);
    rotation = from + (finalRot-from)*e;
    drawWheel();
    if(t < 1) requestAnimationFrame(frame); else done();
  }
  requestAnimationFrame(frame);
}

function confetti(){
  if(reduced) return;
  var colors = ['#e63946','#ffd166','#f77f00','#43aa8b','#4d96ff','#f9c74f'];
  for(var i=0;i<34;i++){
    var d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = (Math.random()*100).toFixed(2) + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (1.6 + Math.random()*1.5).toFixed(2) + 's';
    d.style.animationDelay = (Math.random()*0.35).toFixed(2) + 's';
    d.style.transform = 'rotate(' + Math.floor(Math.random()*360) + 'deg)';
    document.body.appendChild(d);
    (function(node){ setTimeout(function(){ node.remove(); }, 3600); })(d);
  }
}

$('btnKey').addEventListener('click', verifyKey);
$('keyInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') verifyKey(); });

function verifyKey(){
  var v = $('keyInput').value.trim();
  var msg = $('keyMsg');
  if(!v){ msg.className = 'err'; msg.textContent = '请输入密钥'; return; }
  if(KEYS.indexOf(v) === -1){
    msg.className = 'err';
    msg.textContent = '密钥无效，请检查后重试';
    var box = $('keyInput');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    return;
  }
  // 判断本机设备该密钥是否已经抽过
  if(localStorage.getItem('twh_draw_'+v) === '1'){
    msg.className = 'err';
    msg.textContent = '该密钥在此设备已完成抽奖，不可重复参与';
    return;
  }
  msg.className = 'ok';
  msg.textContent = '密钥有效，欢迎参加抽奖！';
  setTimeout(function(){
    $('screenKey').classList.add('hidden');
    $('screenDraw').classList.remove('hidden');
    enterDraw(v);
  }, 420);
}

function enterDraw(key){
  currentKey = key;
  hasDrawn = false;
  var btn = $('btnDraw');
  var note = $('drawNote');
  btn.disabled = false;
  btn.textContent = '去抽奖☞';
  note.textContent = '本机设备每个密钥仅限完成一次有效抽奖；抽到再来一次可继续转动转盘。';
  $('result').textContent = '';
}

$('btnDraw').addEventListener('click', runDraw);

function runDraw(){
  if(spinning || hasDrawn) return;
  spinning = true;
  var btn = $('btnDraw');
  var res = $('result');
  btn.disabled = true;
  res.textContent = '转盘转动中…';
  var idx = pickIndex();
  spinTo(idx, function(){
    spinning = false;
    var prize = PRIZES[idx];
    if(prize.name === "再来一次"){
      res.textContent = '🎉 抽到【再来一次】';
      btn.textContent = '继续';
      btn.disabled = false;
      //再来一次不标记已抽，不写localStorage
    }else{
      //抽到真实奖品，标记该密钥本机已抽，永久锁定
      hasDrawn = true;
      localStorage.setItem('twh_draw_'+currentKey,'1');
      res.textContent = '恭喜您抽中：' + prize.name;
      btn.textContent = '抽奖已结束';
      btn.disabled = true;
      confetti();
    }
  });
}

loadData();
</script>
</body>
</html>
