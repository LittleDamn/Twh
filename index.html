<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWH系列漫画 · 幸运抽奖</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e63946'/%3E%3Cpath d='M32 12l5.2 14.6 15.4.5-12.2 9.4 4.3 14.9L32 42.6 19.3 51.4l4.3-14.9-12.2-9.4 15.4-.5L32 12z' fill='white'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#222;color:#fff;padding:16px}
.wrap{max-width:600px;margin:0 auto}
.title{text-align:center;font-size:22px;color:#ffc857;margin-bottom:16px}
.input-box{margin:12px 0}
input{width:100%;padding:12px;border-radius:8px;border:none;font-size:16px}
button{padding:12px 20px;border:none;border-radius:8px;background:#e63946;color:#fff;font-size:16px;cursor:pointer;margin:4px}
button:disabled{background:#666}
.wheel-box{position:relative;margin:30px auto;width:320px;height:320px}
#wheel{width:100%;height:100%;border-radius:50%;transition:transform 4s cubic-bezier(0.2,0.8,0.2,1)}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid #ffc857}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);align-items:center;justify-content:center;z-index:999}
#modalContent{background:#333;padding:24px;border-radius:12px;text-align:center;max-width:90%;color:#fff}
#qrImg{max-width:200px;margin:12px auto;display:block}
.info-text{margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
<div class="title">TWH系列漫画 · 幸运抽奖</div>
<div class="input-box">
<input id="pwdInput" placeholder="请输入密钥">
</div>
<div style="text-align:center">
<button id="loginBtn">验证密钥</button>
</div>
<div class="wheel-box">
<div class="pointer"></div>
<canvas id="wheel"></canvas>
</div>
<div style="text-align:center;margin-top:12px">
<button id="drawBtn" disabled>开始抽奖</button>
</div>
</div>

<div id="modal">
<div id="modalContent"></div>
</div>

<script>
let config = {};
let prizeList = [];
let passwordList = [];
let ascMap = {vendor:{},browser:{},model:{}};
let loginKey = "";
let isAdminKey = false;
let canDraw = false;
let deviceCode = "";
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
canvas.width = 320;
canvas.height = 320;

async function loadAllFile(){
    const [cRes,pRes,passRes,ascRes] = await Promise.all([
        fetch("config.txt"),
        fetch("prize.txt"),
        fetch("password.txt"),
        fetch("ASC.txt")
    ]);
    if(!cRes.ok || !pRes.ok || !passRes.ok || !ascRes.ok) throw new Error("配置文件缺失");
    const cText = await cRes.text();
    const pText = await pRes.text();
    const passText = await passRes.text();
    const ascText = await ascRes.text();

    config = {};
    cText.split("\n").forEach(line=>{
        line=line.trim();
        if(!line||line.startsWith("#"))return;
        const [k,v]=line.split("=",2);
        config[k.trim()]=v.trim();
    })

    prizeList = [];
    pText.split("\n").forEach(line=>{
        line=line.trim();
        if(!line||line.startsWith("#"))return;
        const arr = line.split(",");
        prizeList.push({name:arr[0],weight:Number(arr[1])})
    })

    passwordList = passText.split("\n").map(i=>i.trim()).filter(i=>i&&!i.startsWith("#"));

    const ascLines = ascText.split("\n");
    let section = "";
    ascLines.forEach(l=>{
        l=l.trim();
        if(l=="#vendor"){section="vendor";return}
        if(l=="#browser"){section="browser";return}
        if(l=="#model"){section="model";return}
        if(!l||l.startsWith("#"))return;
        const [code,name]=l.split(",");
        ascMap[section][code.trim()]=name.trim();
    })
}

function getDeviceInfo(){
    const ua = navigator.userAgent;
    let vendorCode = "U";
    let browserCode = "U";
    let modelCode = "00";
    if(/Windows NT/i.test(ua)) vendorCode="W";
    else if(/iPhone|iPad/i.test(ua)) vendorCode="A";
    else if(/Xiaomi|Mi/i.test(ua)) vendorCode="X";
    else if(/HUAWEI/i.test(ua)) vendorCode="H";
    else if(/OPPO/i.test(ua)) vendorCode="O";
    else if(/vivo/i.test(ua)) vendorCode="V";
    else if(/Samsung/i.test(ua)) vendorCode="S";
    else if(/Android/i.test(ua)) vendorCode="D";

    if(/Chrome/i.test(ua)&&!/Edg/.test(ua)) browserCode="C";
    else if(/Edg/i.test(ua)) browserCode="E";
    else if(/Firefox/i.test(ua)) browserCode="F";
    else if(/Safari/i.test(ua)&&!/Chrome/.test(ua)) browserCode="S";

    if(/iPhone/i.test(ua)) modelCode="01";
    else if(/Xiaomi/i.test(ua)) modelCode="03";
    else if(/Samsung/i.test(ua)) modelCode="09";
    else modelCode="00";

    const randStr = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let rand2 = "";
    for(let i=0;i<2;i++) rand2 += randStr[Math.floor(Math.random()*randStr.length)];
    deviceCode = vendorCode + browserCode + modelCode + rand2;
    return {vendorCode,browserCode,modelCode,rand2};
}

function getUniquePrefix(){
    const names = prizeList.map(p=>p.name);
    const prefixArr = [];
    for(let name of names){
        let pre = "";
        for(let i=0;i<name.length;i++){
            pre += name[i];
            if(!prefixArr.includes(pre)){
                prefixArr.push(pre);
                break;
            }
        }
    }
    const map = {};
    for(let i=0;i<prizeList.length;i++) map[prizeList[i].name]=prefixArr[i];
    return map;
}

function calcCheckCode(raw){
    let s = 0;
    for(let c of raw){
        s = (s + c.charCodeAt(0)*11) % 99;
    }
    return String(s).padStart(2,"0");
}

function makePrizeKey(prizeName){
    const prefixMap = getUniquePrefix();
    const pre = prefixMap[prizeName];
    const d = new Date();
    const yy = String(d.getFullYear()).slice(-2);
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    const yymmdd = yy+mm+dd;
    const raw = pre+yymmdd+deviceCode;
    const ck = calcCheckCode(raw);
    return pre+yymmdd+deviceCode+ck;
}

// 草料API生成二维码
function getQrImgSrc(keyStr){
    return `https://api.2dcode.biz/v1/create-qr-code?data=${encodeURIComponent(keyStr)}`;
}

function showModal(html){
    document.getElementById("modalContent").innerHTML = html;
    document.getElementById("modal").style.display = "flex";
}
function hideModal(){
    document.getElementById("modal").style.display = "none";
}

function drawWheel(targetIndex){
    const n = prizeList.length;
    const degPer = 360/n;
    ctx.clearRect(0,0,320,320);
    const r = 150;
    const colors = ["#e63946","#ffc857","#457b9d","#2a9d8f","#f4a261","#264653"];
    for(let i=0;i<n;i++){
        const start = degPer*i * Math.PI /180;
        const end = degPer*(i+1)*Math.PI/180;
        ctx.beginPath();
        ctx.moveTo(160,160);
        ctx.arc(160,160,r,start,end);
        ctx.fillStyle = colors[i%colors.length];
        ctx.fill();
        ctx.strokeStyle="#fff";
        ctx.stroke();
        ctx.save();
        ctx.translate(160,160);
        ctx.rotate(start + (end-start)/2);
        ctx.fillStyle="#fff";
        ctx.font="14px sans-serif";
        ctx.fillText(prizeList[i].name,70,5);
        ctx.restore();
    }
    const totalRotate = 360*8 + (degPer*(n-targetIndex) - degPer/2);
    canvas.style.transition = "transform 4s cubic-bezier(0.2,0.8,0.2,1)";
    canvas.style.transform = `rotate(${totalRotate}deg)`;
}

function getRandomPrize(bias){
    let total = 0;
    prizeList.forEach(p=>{
        total += p.weight * bias;
    })
    let r = Math.random()*total;
    for(let p of prizeList){
        r -= p.weight*bias;
        if(r<=0) return p;
    }
    return prizeList[prizeList.length-1];
}

function getDrawCount(){
    const k = "draw_"+loginKey;
    const v = localStorage.getItem(k)||"0";
    return Number(v);
}
function addDrawCount(){
    const k = "draw_"+loginKey;
    const now = getDrawCount();
    localStorage.setItem(k,now+1);
}
function getBias(){
    const cnt = getDrawCount();
    const dec = Number(config.decPerDraw||0.1);
    const minB = Number(config.minBias||1);
    const initB = Number(config.initBias||1.6);
    const b = initB - cnt*dec;
    return Math.max(b,minB);
}

document.getElementById("loginBtn").onclick = async ()=>{
    await loadAllFile();
    const inputKey = document.getElementById("pwdInput").value.trim();
    loginKey = inputKey;
    isAdminKey = inputKey === config.adminKey;
    if(passwordList.includes(inputKey) || isAdminKey){
        canDraw=true;
        document.getElementById("drawBtn").disabled=false;
        getDeviceInfo();
        showModal(`<div><h3>✅密钥验证成功</h3><p>可以开始抽奖</p><button onclick="hideModal()">确定</button></div>`)
    }else{
        showModal(`<div><h3>❌密钥无效</h3><button onclick="hideModal()">关闭</button></div>`)
    }
}

document.getElementById("drawBtn").onclick = ()=>{
    if(!canDraw)return;
    document.getElementById("drawBtn").disabled=true;
    const bias = getBias();
    const prize = getRandomPrize(bias);
    const idx = prizeList.findIndex(i=>i.name===prize.name);
    drawWheel(idx);
    setTimeout(()=>{
        addDrawCount();
        if(prize.name === "谢谢支持"){
            showModal(`
                <h2>谢谢支持</h2>
                <p>本次未中奖</p>
                <button onclick="hideModal()">关闭</button>
            `)
        }else if(prize.name === "再来一次"){
            showModal(`
                <h2>🎉再来一次</h2>
                <p>获得额外抽奖机会</p>
                <button onclick="hideModal();document.getElementById('drawBtn').disabled=false;">继续</button>
            `)
        }else{
            const key = makePrizeKey(prize.name);
            const qrSrc = getQrImgSrc(key);
            showModal(`
                <h2>🎉恭喜中奖</h2>
                <p class="info-text">奖品：${prize.name}</p>
                <p class="info-text">兑换密钥：<b>${key}</b></p>
                <img id="qrImg" src="${qrSrc}" alt="二维码">
                <p class="info-text">扫码复制密钥，前往UNPWD.html验证</p>
                <button onclick="hideModal();document.getElementById('drawBtn').disabled=false;">关闭</button>
            `)
        }
    },4200)
}
</script>
</body>
</html>
